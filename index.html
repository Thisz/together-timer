<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Together Timer" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Together Timer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --danger: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #f9fafb;
        --muted: #9ca3af;
        --border: #374151;
        --accent: #60a5fa;
        --accent-text: #0f172a;
        --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    main { width: 100%; max-width: 560px; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    .subtitle { margin: 0 0 24px; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .fields {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    label { display: block; font-weight: 600; font-size: 0.95rem; }
    input {
      width: 100%;
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 1.25rem;
      text-align: center;
      background: transparent;
      color: var(--text);
    }
    input:focus { outline: 3px solid color-mix(in srgb, var(--accent) 30%, transparent); border-color: var(--accent); }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .primary { background: var(--accent); color: var(--accent-text); }
    .secondary { background: transparent; color: var(--text); border: 1px solid var(--border); margin-top: 10px; }
    .timer {
      font-variant-numeric: tabular-nums;
      font-size: clamp(3rem, 16vw, 6rem);
      text-align: center;
      letter-spacing: -0.04em;
      margin: 12px 0 4px;
      font-weight: 700;
    }
    .status { text-align: center; color: var(--muted); min-height: 1.5em; }
    .error { color: var(--danger); font-weight: 600; margin-top: 12px; }
    .hidden { display: none; }
    .small { color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
    .linkbox {
      word-break: break-all;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Together Timer</h1>
    <p class="subtitle">Create one countdown and share it so both people see the same remaining time.</p>

    <section id="creator" class="card">
      <div class="fields">
        <label>Hours
          <input id="hours" type="number" inputmode="numeric" min="0" step="1" value="0" aria-label="Hours" />
        </label>
        <label>Minutes
          <input id="minutes" type="number" inputmode="numeric" min="0" step="1" value="30" aria-label="Minutes" />
        </label>
        <label>Seconds
          <input id="seconds" type="number" inputmode="numeric" min="0" step="1" value="0" aria-label="Seconds" />
        </label>
      </div>

      <label style="margin-top:16px;">Optional title
        <input id="title" type="text" maxlength="60" placeholder="Call again" style="text-align:left;font-size:1rem;" />
      </label>

      <button id="createBtn" class="primary" type="button" style="margin-top:16px;">Create shared timer</button>
      <div id="error" class="error hidden" role="alert"></div>
      <p class="small">No account or paid service is needed. The shared link stores only the finishing time and optional title.</p>
    </section>

    <section id="timerCard" class="card hidden" aria-live="polite">
      <div id="timerTitle" class="status"></div>
      <div id="countdown" class="timer">00:00:00</div>
      <div id="endTime" class="status"></div>
      <button id="shareBtn" class="primary" type="button">Share timer</button>
      <button id="newBtn" class="secondary" type="button">Create another timer</button>
      <div id="shareLink" class="linkbox hidden"></div>
    </section>
  </main>

  <script>
    const creator = document.getElementById('creator');
    const timerCard = document.getElementById('timerCard');
    const countdown = document.getElementById('countdown');
    const endTimeEl = document.getElementById('endTime');
    const timerTitle = document.getElementById('timerTitle');
    const errorEl = document.getElementById('error');
    const shareLinkEl = document.getElementById('shareLink');

    let endTimestamp = null;
    let intervalId = null;
    let currentTitle = '';

    function safeNumber(id) {
      const value = Number(document.getElementById(id).value || 0);
      return Number.isFinite(value) && value > 0 ? Math.floor(value) : 0;
    }

    function formatRemaining(ms) {
      const total = Math.max(0, Math.ceil(ms / 1000));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      return [hours, minutes, seconds].map(v => String(v).padStart(2, '0')).join(':');
    }

    function makeShareUrl() {
      const url = new URL(window.location.href);
      url.search = '';
      url.hash = '';
      url.searchParams.set('end', String(endTimestamp));
      if (currentTitle) url.searchParams.set('title', currentTitle);
      return url.toString();
    }

    function updateTimer() {
      const remaining = endTimestamp - Date.now();
      countdown.textContent = formatRemaining(remaining);

      if (remaining <= 0) {
        clearInterval(intervalId);
        intervalId = null;
        countdown.textContent = '00:00:00';
        endTimeEl.textContent = 'Time is up — call each other again.';
        document.title = 'Time is up — Together Timer';
        if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
      } else {
        document.title = `${formatRemaining(remaining)} — Together Timer`;
      }
    }

    function showTimer(end, title = '') {
      endTimestamp = end;
      currentTitle = title;
      creator.classList.add('hidden');
      timerCard.classList.remove('hidden');
      timerTitle.textContent = title || 'Shared countdown';
      endTimeEl.textContent = `Finishes at ${new Date(endTimestamp).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'})}`;
      shareLinkEl.classList.add('hidden');
      if (intervalId) clearInterval(intervalId);
      updateTimer();
      intervalId = setInterval(updateTimer, 250);
    }

    document.getElementById('createBtn').addEventListener('click', () => {
      errorEl.classList.add('hidden');
      const hours = safeNumber('hours');
      const minutes = safeNumber('minutes');
      const seconds = safeNumber('seconds');
      const totalSeconds = hours * 3600 + minutes * 60 + seconds;

      if (totalSeconds <= 0) {
        errorEl.textContent = 'Please enter a timer length greater than zero.';
        errorEl.classList.remove('hidden');
        return;
      }

      const title = document.getElementById('title').value.trim();
      showTimer(Date.now() + totalSeconds * 1000, title);
      history.replaceState({}, '', makeShareUrl());
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      const url = makeShareUrl();
      const text = currentTitle ? `${currentTitle}: join my live countdown.` : 'Join my live countdown.';
      if (navigator.share) {
        try {
          await navigator.share({ title: 'Together Timer', text, url });
          return;
        } catch (e) {
          if (e.name === 'AbortError') return;
        }
      }
      shareLinkEl.textContent = url;
      shareLinkEl.classList.remove('hidden');
      shareLinkEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    document.getElementById('newBtn').addEventListener('click', () => {
      if (intervalId) clearInterval(intervalId);
      intervalId = null;
      history.replaceState({}, '', window.location.pathname);
      timerCard.classList.add('hidden');
      creator.classList.remove('hidden');
      document.title = 'Together Timer';
    });

    const params = new URLSearchParams(window.location.search);
    const sharedEnd = Number(params.get('end'));
    const sharedTitle = params.get('title') || '';
    if (Number.isFinite(sharedEnd) && sharedEnd > 0) {
      showTimer(sharedEnd, sharedTitle);
    }

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
